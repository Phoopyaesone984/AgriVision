{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h2 class="text-center text-success mb-4">
                    Create Account
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label>Username</label>
                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label>Email</label>
                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label>Password</label>
                        {{ form.password1 }}
                    </div>

                    <div class="mb-3">
                        <label>Confirm Password</label>
                        {{ form.password2 }}
                    </div>

                    <button class="btn btn-success w-100">
                        Create Account
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
